{% extends 'exchange/base.html' %}{% block content %}<div class="container py-5"><span class="eyebrow">KEEP IN THE LOOP</span><h1 class="fw-bold mt-2 mb-4">Notifications</h1><div class="panel">{% for n in notifications %}<div class="list-line"><span>{{ n.message }}</span><small class="text-secondary">{{ n.timestamp|date:'M j, g:i a' }}</small></div>{% empty %}<p class="text-secondary">All caught up. New requests and session updates will appear here.</p>{% endfor %}</div></div>{% endblock %}
